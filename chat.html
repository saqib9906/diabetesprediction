<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Web App</title>
</head>
<body>
    <h1>Chat with GPT</h1>
    <form method="POST">
        <textarea name="user_input" rows="5" cols="40" placeholder="Ask something..."></textarea><br><br>
        <input type="submit" value="Send">
    </form>

    {% if response %}
        <h2>Response:</h2>
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
